[project]
name = "ha-ufanet-intercom"
version = "2.0.0rc2"
description = "Home Assistant custom integration for account-discovered Ufanet shared intercoms"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "aiohttp>=3.12.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
