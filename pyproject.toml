[project]
name = "ha-ufanet-intercom"
version = "2.1.0b7"
description = "Home Assistant custom integration for account-discovered Ufanet shared intercoms"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "pymicro-vad==1.0.1",
]

[dependency-groups]
dev = [
  "aiohttp>=3.12.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
